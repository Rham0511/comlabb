<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Laboratory Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            background: #07150F;
        }

        body {
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }

        .landing-hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url('/images/minsu-bg.jpg.webp');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            isolation: isolate;
        }

        .landing-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(7, 21, 15, 0.90), rgba(10, 29, 21, 0.80));
            z-index: 0;
        }

        .landing-hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .landing-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 100%;
            margin: 0;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(2, 8, 15, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: none;
            border-radius: 0;
        }

        .landing-brand-group {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            min-width: 0;
        }

        .landing-brand-logo {
            width: 56px;
            height: 56px;
            min-width: 56px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .landing-brand-copy {
            display: flex;
            flex-direction: column;
            gap: 0.08rem;
            min-width: 0;
        }

        .landing-brand-main {
            color: #f8fafc;
            font-size: 1.125rem;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }

        .landing-brand-sub {
            color: #a7f3d0;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .landing-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            flex: 1;
        }

        .landing-nav a {
            position: relative;
            color: rgba(226, 232, 240, 0.9);
            font-size: 1rem;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        .landing-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -0.4rem;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.2s ease;
        }

        .landing-nav a:hover {
            color: #bbf7d0;
        }

        .landing-nav a:hover::after {
            width: 100%;
        }

        .landing-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .landing-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            padding: 0.625rem 1.5rem;
            border-radius: 0.85rem;
            font-size: 1rem;
            font-weight: 800;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .landing-btn:hover {
            transform: translateY(-1px);
        }

        .landing-btn.secondary {
            background: rgba(15, 23, 42, 0.55);
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .landing-btn.primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 10px 24px rgba(34, 197, 94, 0.25);
        }

        .mobile-menu-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: white;
            font-size: 1.2rem;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 8, 5, 0.96);
            backdrop-filter: blur(12px);
            z-index: 1000;
            padding-top: 5.5rem;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu-items {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 1rem 1.25rem;
        }

        .mobile-menu-items a {
            color: white;
            padding: 0.9rem 1rem;
            border-radius: 0.8rem;
            font-weight: 600;
            background: rgba(15, 23, 42, 0.4);
        }

        .landing-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7rem 1rem 4rem;
        }

        .landing-hero-grid {
            width: min(1200px, calc(100% - 2rem));
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 3rem;
            align-items: center;
        }

        .landing-copy {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            max-width: 620px;
        }

        .landing-eyebrow {
            display: block;
            margin: 0;
            color: #065f46;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-weight: 900;
            font-size: 1.5rem;
            line-height: 1.2;
        }

        .landing-copy h1 {
            margin: 0;
            color: #f8fafc;
            font-size: clamp(2.5rem, 5vw, 4.25rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
            font-weight: 800;
        }

        .landing-description {
            margin: 0;
            color: rgba(226, 232, 240, 0.9);
            font-size: 1.125rem;
            line-height: 1.7;
            max-width: 36rem;
        }

        .landing-cta-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.4rem;
        }

        .landing-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.95rem 1.7rem;
            border-radius: 0.95rem;
            background: linear-gradient(135deg, #064e3b, #065f46);
            color: #f8fafc;
            font-weight: 800;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .landing-cta:hover {
            transform: translateY(-1px);
            background: linear-gradient(135deg, #065f46, #047857);
        }

        .landing-visual-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-logo-badge {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(22rem, 70vw);
            height: auto;
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }

        .landing-logo-badge::before {
            display: none;
        }

        .landing-badge-image {
            width: 100%;
            max-width: 340px;
            height: auto;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 900px) {
            .landing-header {
                flex-wrap: wrap;
            }

            .landing-nav,
            .landing-actions {
                display: none;
            }

            .mobile-menu-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .landing-hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }

            .landing-copy {
                max-width: none;
                align-items: center;
            }
        }

        @media (max-width: 640px) {
            .landing-header {
                padding: 0.8rem 0.9rem;
                width: min(100% - 1rem, 1200px);
            }

            .landing-brand-main {
                font-size: 0.74rem;
            }

            .landing-brand-sub {
                font-size: 0.56rem;
                letter-spacing: 0.06em;
            }

            .landing-brand-logo {
                width: 32px;
                height: 32px;
            }

            .landing-description {
                font-size: 0.98rem;
            }

            .landing-cta-row {
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .landing-btn,
            .landing-cta,
            .landing-nav a {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <section class="landing-hero">
        <div class="landing-hero-overlay"></div>

        <div class="landing-hero-content">
            <header class="landing-header">
                <div class="landing-brand-group">
                    <img src="/images/minsu-logo.png.jpg" alt="Mindoro State University Logo" class="landing-brand-logo" />
                    <div class="landing-brand-copy">
                        <span class="landing-brand-main">Mindoro State University</span>
                        <span class="landing-brand-sub">College of Computer Studies</span>
                    </div>
                </div>

                <nav class="landing-nav" aria-label="Main navigation"></nav>

                <div class="landing-actions">
                    <a href="/login" class="landing-btn secondary">Login</a>
                    <a href="/register" class="landing-btn primary">Sign Up</a>
                </div>

                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </header>

            <div class="mobile-menu" id="mobileMenu">
                <div class="mobile-menu-items">
                    <a href="/login" onclick="closeMobileMenu()">Login</a>
                    <a href="/register" onclick="closeMobileMenu()">Sign Up</a>
                </div>
            </div>

            <main class="landing-main">
                <div class="landing-hero-grid">
                    <div class="landing-copy">
                        <p class="landing-eyebrow">Welcome to</p>
                        <h1>Computer Laboratory Management System</h1>
                        <p class="landing-description">Efficiently manage laboratory schedules, attendance, equipment inventory, and maintenance requests in one centralized platform.</p>
                        <div class="landing-cta-row">
                            <a href="/login" class="landing-cta">Get Started</a>
                        </div>
                    </div>

                    <div class="landing-visual-wrap">
                        <div class="landing-logo-badge">
                            <img src="/images/ccs-logo.png" alt="CCS Logo" class="landing-badge-image" />
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script>
        const mobileMenuToggle = document.getElementById('mobileMenuToggle');
        const mobileMenu = document.getElementById('mobileMenu');

        if (mobileMenuToggle && mobileMenu) {
            mobileMenuToggle.addEventListener('click', function() {
                mobileMenu.classList.toggle('active');
                mobileMenuToggle.classList.toggle('active');
            });
        }

        function closeMobileMenu() {
            if (mobileMenu) mobileMenu.classList.remove('active');
            if (mobileMenuToggle) mobileMenuToggle.classList.remove('active');
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.landing-header') && !event.target.closest('.mobile-menu')) {
                closeMobileMenu();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeMobileMenu();
            }
        });
    </script>
</body>
</html>
